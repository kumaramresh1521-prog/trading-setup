<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="100%" fill="none">
  <defs>
    <!-- Cyan to Emerald Gradient -->
    <linearGradient id="tdGlowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="tdNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- ICON EMBLEM (Left Side) -->
  <g transform="translate(10, 8)">
    <!-- Terminal Outer Frame Bracket -->
    <path d="M 12 24 L 12 12 L 56 12 L 56 24" stroke="url(#tdGlowGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
    <path d="M 12 48 L 12 60 L 32 60" stroke="url(#tdGlowGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
    <path d="M 46 60 L 56 60 L 56 50" stroke="url(#tdGlowGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />

    <!-- Candlestick 1 (Left) -->
    <line x1="22" y1="28" x2="22" y2="46" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
    <rect x="20" y="32" width="4" height="10" rx="1" fill="#38bdf8" opacity="0.8"/>

    <!-- Candlestick 2 (Center High) -->
    <line x1="34" y1="16" x2="34" y2="44" stroke="#34d399" stroke-width="1.5" />
    <rect x="32" y="20" width="4.5" height="15" rx="1" fill="#34d399" />

    <!-- Candlestick 3 (Right Higher Breakout) -->
    <line x1="46" y1="12" x2="46" y2="38" stroke="#10b981" stroke-width="1.5" />
    <rect x="44" y="16" width="4.5" height="13" rx="1" fill="#10b981" />

    <!-- Momentum Breakout Impulse Arrow -->
    <path d="M 10 54 L 26 36 L 36 44 L 58 14" stroke="url(#tdGlowGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#tdNeonGlow)" />
    <!-- Arrowhead -->
    <path d="M 48 13 L 59 13 L 59 24" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Base Support Floor Line -->
    <path d="M 28 66 L 40 66" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- LOGO TYPOGRAPHY -->
  <g transform="translate(86, 52)">
    <!-- "TRADERS" in Bold Premium White -->
    <text x="0" y="0" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-size="29" font-weight="900" fill="#f8fafc" letter-spacing="1.2">TRADERS</text>
    
    <!-- "DESK" in Electric Cyan -->
    <text x="146" y="0" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-size="29" font-weight="900" fill="#38bdf8" letter-spacing="1.2">DESK</text>

    <!-- ".in" National Identity Badge -->
    <g transform="translate(244, -23)">
      <rect x="0" y="0" width="42" height="24" rx="5" fill="url(#badgeGrad)" />
      <text x="21" y="16.5" font-family="'JetBrains Mono', 'Inter', monospace" font-size="13" font-weight="900" fill="#040814" text-anchor="middle" letter-spacing="0.5">.in</text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="1" y="19" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#64748b" letter-spacing="2.8">INSTITUTIONAL DERIVATIVES &amp; QUANT TERMINAL</text>
  </g>
</svg>
